<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Factuur maken — MVDBmedia</title>
  <link rel="preload" href="/fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --bg:#0d0d0d; --elev:#161616; --float:#1f1f1f; --card:#1a1a1a; --border:#2a2a2a;
            --border-light:#333; --orange:#ff8c00; --orange-dim:#c96e00; --text:#f0ede8;
            --muted:#a09890; --dim:#8f8882; --font-display:'Bebas Neue',sans-serif;
            --font-body:'Inter',sans-serif; }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px;
           line-height:1.5; padding:0; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 24px;
              border-bottom:1px solid var(--border); background:var(--elev); position:sticky; top:0; z-index:10; }
    .logo { font-family:var(--font-display); font-size:1.5rem; letter-spacing:0.06em; }
    .logo span { color:var(--orange); }
    .btn { border:none; border-radius:4px; font-family:var(--font-body); font-weight:600;
           font-size:0.8rem; cursor:pointer; padding:9px 16px; transition:transform 0.15s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
    .btn:active { transform:translateY(1px); }
    .btn:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
    .btn-oranje { background:var(--orange); color:#000; }
    .btn-oranje:hover { opacity:0.92; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-ghost:hover { color:var(--text); border-color:var(--border-light); }
    .btn-klein { padding:6px 10px; font-size:0.72rem; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:0; align-items:start; }
    .form-kol { padding:24px; border-right:1px solid var(--border); }
    .preview-kol { padding:24px; position:sticky; top:69px; }
    @media (max-width:900px){ .layout{grid-template-columns:1fr;} .form-kol{border-right:none;border-bottom:1px solid var(--border);} .preview-kol{position:static;} }
    h2 { font-family:var(--font-display); font-size:1.15rem; letter-spacing:0.05em; color:var(--text);
         margin:0 0 14px; font-weight:400; }
    .sectie { margin-bottom:28px; }
    label { display:block; font-size:0.66rem; letter-spacing:0.08em; text-transform:uppercase;
            color:var(--muted); margin-bottom:5px; }
    input, select { width:100%; padding:9px 11px; background:var(--bg); border:1px solid var(--border);
            border-radius:4px; color:var(--text); font-size:0.85rem; font-family:var(--font-body);
            outline:none; transition:border-color 0.2s ease; }
    input:focus, select:focus { border-color:var(--orange); }
    .rij2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .veld { margin-bottom:12px; }
    .dienstgroep { margin-bottom:16px; }
    .dienstgroep-kop { font-size:0.62rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
                       color:var(--dim); margin-bottom:7px; padding-bottom:4px; border-bottom:1px solid var(--border); }
    .kaarten { display:flex; flex-wrap:wrap; gap:7px; }
    .dienstkaart { background:var(--card); border:1px solid var(--border); border-radius:5px;
                   padding:8px 11px; cursor:pointer; font-size:0.78rem; white-space:nowrap;
                   transition:border-color 0.15s ease, background 0.15s ease, transform 0.15s ease; }
    .dienstkaart:hover { border-color:var(--orange); background:var(--float); transform:translateY(-1px); }
    .dienstkaart:active { transform:translateY(0); }
    .dienstkaart:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
    .dienstkaart .k-label { color:var(--text); font-weight:500; }
    .dienstkaart .k-prijs { color:var(--orange); font-weight:600; }
    .regel { display:grid; grid-template-columns:22px 1fr 58px 84px 84px 30px; gap:8px; align-items:center;
             padding:8px; background:var(--card); border:1px solid var(--border); border-radius:5px; margin-bottom:7px; }
    .regel.sleep-over { border-color:var(--orange); }
    .regel input { padding:7px 9px; font-size:0.8rem; }
    .regel .greep { cursor:grab; color:var(--dim); text-align:center; user-select:none; }
    .regel .regeltotaal { text-align:right; font-weight:600; color:var(--text); font-size:0.82rem; padding-right:4px; }
    .regel .verwijder { background:transparent; border:none; color:var(--dim); cursor:pointer; font-size:1rem; padding:0; transition:color 0.15s ease; }
    .regel .verwijder:hover { color:#ff6b6b; }
    .regelkop { display:grid; grid-template-columns:22px 1fr 58px 84px 84px 30px; gap:8px;
                font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--dim); padding:0 8px 4px; }
    .korting-opties { display:flex; gap:14px; margin-bottom:10px; }
    .korting-opties label { display:flex; align-items:center; gap:5px; text-transform:none; letter-spacing:0; font-size:0.8rem; color:var(--text); margin:0; cursor:pointer; }
    .korting-opties input[type=radio] { width:auto; }
    /* preview */
    .preview { background:#fff; color:#111; border-radius:6px; padding:32px; font-size:12px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
    .pv-kop { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; }
    .pv-logo { font-family:var(--font-display); font-size:1.6rem; letter-spacing:0.04em; color:#111; }
    .pv-logo span { color:var(--orange); }
    .pv-titel { font-family:var(--font-display); font-size:1.8rem; letter-spacing:0.04em; color:#111; }
    .pv-meta-blok { display:flex; justify-content:space-between; margin-bottom:20px; gap:20px; }
    .pv-label { color:#888; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; }
    .pv-tabel { width:100%; border-collapse:collapse; margin:16px 0; }
    .pv-tabel th { background:#111; color:#fff; text-align:left; padding:7px 9px; font-size:10px; font-weight:600; }
    .pv-tabel th.r, .pv-tabel td.r { text-align:right; }
    .pv-tabel td { padding:7px 9px; border-bottom:1px solid #eee; }
    .pv-tot { margin-left:auto; width:55%; }
    .pv-tot .tr { display:flex; justify-content:space-between; padding:4px 0; }
    .pv-tot .tr.groot { font-weight:700; font-size:14px; border-top:2px solid var(--orange); padding-top:8px; margin-top:4px; }
    .pv-voet { margin-top:24px; padding-top:14px; border-top:1px solid #eee; color:#666; font-size:10px; line-height:1.6; }
    .waarschuwing { color:#ff6b6b; font-size:0.72rem; margin-top:5px; min-height:1em; }
    /* Smalle schermen: 2-koloms form-rijen stapelen zodat niets buiten beeld valt.
       Staat ná de .rij2-basisregel zodat de override wint bij gelijke specificiteit. */
    @media (max-width:560px){
      .rij2 { grid-template-columns:1fr; }
      .layout { grid-template-columns:minmax(0,1fr); }
      .form-kol, .preview-kol { min-width:0; padding:16px; }
      .preview { padding:20px; }
      .pv-tot { width:100%; }
      .pv-meta-blok { flex-wrap:wrap; }
      input, select { min-width:0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="logo">MVDB<span>media</span> · <span id="topbar-type">Factuur</span></div>
      <div style="display:flex; gap:0; border:1px solid var(--border); border-radius:5px; overflow:hidden;">
        <button class="btn btn-klein" id="toggle-factuur" type="button" style="border-radius:0;">Factuur</button>
        <button class="btn btn-klein" id="toggle-offerte" type="button" style="border-radius:0;">Offerte</button>
      </div>
    </div>
    <div style="display:flex; gap:10px;">
      <a class="btn btn-ghost" href="/admin/overzicht/" style="text-decoration:none; display:inline-flex; align-items:center;">Overzicht</a>
      <button class="btn btn-ghost" id="omzet-knop" type="button" style="display:none;">Zet om naar factuur</button>
      <button class="btn btn-oranje" id="pdf-knop" type="button">Factuur genereren (PDF)</button>
      <button class="btn btn-ghost" id="logout-knop" type="button">Uitloggen</button>
    </div>
  </div>

  <main class="layout">
    <!-- FORMULIER -->
    <div class="form-kol">
      <div class="sectie">
        <h2>Klantgegevens</h2>
        <div class="veld">
          <label>Opgeslagen klant</label>
          <div style="display:flex; gap:6px; align-items:center;">
            <select id="klant-select" style="flex:1;">
              <option value="">— Nieuwe klant —</option>
            </select>
            <button class="btn btn-ghost btn-klein" id="klant-verwijder" type="button" style="white-space:nowrap;" disabled>Verwijder</button>
          </div>
        </div>
        <div class="veld"><label>Bedrijfsnaam</label><input id="k-bedrijf" data-klant="bedrijf"></div>
        <div class="rij2">
          <div class="veld"><label>Contactpersoon</label><input id="k-contact" data-klant="contact"></div>
          <div class="veld"><label>E-mail</label><input id="k-email" data-klant="email" type="email"></div>
        </div>
        <div class="veld"><label>Adres</label><input id="k-adres" data-klant="adres"></div>
        <div class="rij2">
          <div class="veld"><label>Postcode + plaats</label><input id="k-pcplaats" data-klant="postcodePlaats"></div>
          <div class="veld"><label>KvK / btw (optioneel)</label><input id="k-kvkbtw" data-klant="kvkBtw"></div>
        </div>
      </div>

      <div class="sectie">
        <h2 id="sectie-doc-kop">Factuurgegevens</h2>
        <div class="rij2">
          <div class="veld">
            <label id="label-nummer">Factuurnummer</label>
            <div style="display:flex; gap:6px;">
              <input id="f-nummer" data-factuur="nummer" placeholder="2026-001">
              <button class="btn btn-ghost btn-klein" id="reserveer-knop" type="button" style="white-space:nowrap;">Reserveer</button>
            </div>
            <div class="waarschuwing" id="nummer-waarschuwing"></div>
          </div>
          <div class="veld"><label>Referentie / project (optioneel)</label><input id="f-ref" data-factuur="referentie"></div>
        </div>
        <div class="veld" id="ophaal-blok" style="display:none;">
          <label>Bestaande offerte ophalen</label>
          <div style="display:flex; gap:6px;">
            <input id="ophaal-nummer" placeholder="OFF-2026-001">
            <button class="btn btn-ghost btn-klein" id="ophaal-knop" type="button" style="white-space:nowrap;">Offerte ophalen</button>
          </div>
          <div class="waarschuwing" id="ophaal-waarschuwing"></div>
        </div>
        <div class="rij2">
          <div class="veld"><label>Factuurdatum</label><input id="f-datum" data-factuur="datum" type="date"></div>
          <div class="veld"><label id="label-vervaldatum">Vervaldatum</label><input id="f-vervaldatum" data-factuur="vervaldatum" type="date"></div>
        </div>
      </div>

      <div class="sectie">
        <h2>Diensten</h2>
        <div class="kaarten" id="dienstkaarten"></div>
      </div>

      <div class="sectie">
        <h2>Regels</h2>
        <div class="regelkop"><span></span><span>Omschrijving</span><span>Aantal</span><span>Stukprijs</span><span style="text-align:right;">Totaal</span><span></span></div>
        <div id="regels"></div>
        <button class="btn btn-ghost btn-klein" id="regel-toevoegen" type="button" style="margin-top:6px;">+ Regel toevoegen</button>
      </div>

      <div class="sectie">
        <h2>Korting</h2>
        <div class="korting-opties">
          <label><input type="radio" name="korting-type" value="geen" checked> Geen</label>
          <label><input type="radio" name="korting-type" value="bedrag"> Vast bedrag</label>
          <label><input type="radio" name="korting-type" value="percentage"> Percentage</label>
        </div>
        <div class="rij2" id="korting-velden" style="display:none;">
          <div class="veld"><label id="korting-waarde-label">Bedrag (€)</label><input id="korting-waarde" type="number" min="0" step="0.01" value="0"></div>
          <div class="veld"><label>Omschrijving</label><input id="korting-omschrijving" placeholder="bijv. Introductiekorting"></div>
        </div>
      </div>

      <div class="sectie">
        <h2>Btw</h2>
        <div class="veld">
          <select id="btw-select">
            <option value="21">21% (standaard)</option>
            <option value="0">0%</option>
            <option value="verlegd">Btw verlegd</option>
          </select>
        </div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview-kol">
      <div class="preview" id="preview"></div>
    </div>
  </main>

  <script src="/admin/vendor/jspdf.umd.min.js"></script>
  <script src="/admin/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="/admin/vendor/bebas-font.js"></script>
  <script src="/admin/js/factuur.js"></script>
</body>
</html>
